<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tritiya — Fraud Detection{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Syne (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">

  <!-- Chart.js (used on analytics page) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    /* ── Tailwind custom theme extension ── */
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Syne", "sans-serif"],
            body: ["DM Sans", "sans-serif"],
          },
          colors: {
            navy: { 950: "#040d1a", 900: "#071428", 800: "#0b1f3f", 700: "#102b56", 600: "#153768" },
            slate: { 400: "#94a3b8", 300: "#cbd5e1", 200: "#e2e8f0" },
            crime: { 500: "#ef4444", 400: "#f87171", 300: "#fca5a5" },
            safe: { 500: "#22c55e", 400: "#4ade80" },
            gold: { 400: "#fbbf24", 300: "#fcd34d" },
          },
          backgroundImage: {
            "grid-navy": "linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px)",
          },
          backgroundSize: { "grid": "40px 40px" },
          animation: {
            "pulse-slow": "pulse 3s cubic-bezier(0.4,0,0.6,1) infinite",
            "fade-up": "fadeUp .5s ease forwards",
            "scan": "scan 2.5s linear infinite",
          },
          keyframes: {
            fadeUp: { "0%": { opacity: "0", transform: "translateY(16px)" }, "100%": { opacity: "1", transform: "translateY(0)" } },
            scan: { "0%": { top: "-4px" }, "100%": { top: "100%" } },
          },
        },
      },
    };
  </script>

  <style>
    /* ── Global base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-family: "DM Sans", sans-serif;
    }

    body {
      background-color: #040d1a;
      color: #e2e8f0;
    }

    /* ── Scrollbar styling ── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #040d1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #102b56;
      border-radius: 3px;
    }

    /* ── Glowing borders ── */
    .glow-border {
      box-shadow: 0 0 0 1px rgba(21, 55, 104, .8), 0 0 20px rgba(21, 55, 104, .4);
    }

    .glow-red {
      box-shadow: 0 0 0 1px rgba(239, 68, 68, .5), 0 0 20px rgba(239, 68, 68, .2);
    }

    .glow-green {
      box-shadow: 0 0 0 1px rgba(34, 197, 94, .5), 0 0 20px rgba(34, 197, 94, .2);
    }

    /* ── Scan-line overlay for hero ── */
    .scanlines::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .08) 2px, rgba(0, 0, 0, .08) 4px);
    }

    /* ── Active nav indicator ── */
    .nav-active {
      color: #fbbf24;
    }

    .nav-active::after {
      content: "";
      display: block;
      height: 2px;
      background: #fbbf24;
      border-radius: 1px;
      margin-top: 2px;
    }

    /* ── Card hover lift ── */
    .card-lift {
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .4);
    }
  </style>

  {% block head %}{% endblock %}
</head>

<body class="font-body antialiased min-h-screen flex flex-col">

  <!-- ════════════════════════════════ NAVBAR ════════════════════════════════ -->
  <nav id="navbar" class="fixed top-0 inset-x-0 z-50 flex items-center justify-between
              px-6 md:px-12 py-4 transition-all duration-300" style="background:rgba(4,13,26,0);">

    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 group">
      <!-- Shield icon (inline SVG) -->
      <svg class="w-8 h-8 text-gold-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0
                 013 10.5c0 5.592 3.824 10.29 9 11.622
                 5.176-1.332 9-6.03 9-11.622
                 0-1.31-.21-2.571-.598-3.751h-.152
                 c-3.196 0-6.1-1.249-8.25-3.286z" />
      </svg>
      <span class="font-display text-xl tracking-tight text-white">
        Tri<span class="text-gold-400">tiya</span>
      </span>
    </a>

    <!-- Desktop links -->
    <ul class="hidden md:flex items-center gap-8 text-sm text-slate-300">
      <li><a href="/"
          class="hover:text-white transition-colors {% if request.endpoint=='index'    %}nav-active{% endif %}">Home</a>
      </li>
      <li><a href="/dashboard"
          class="hover:text-white transition-colors {% if request.endpoint=='dashboard' %}nav-active{% endif %}">Dashboard</a>
      </li>
      <li><a href="/analytics"
          class="hover:text-white transition-colors {% if request.endpoint=='analytics' %}nav-active{% endif %}">Analytics</a>
      </li>
      <li><a href="/about"
          class="hover:text-white transition-colors {% if request.endpoint=='about'     %}nav-active{% endif %}">About</a>
      </li>
    </ul>

    <!-- CTA -->
    <a href="/dashboard" class="hidden md:inline-flex items-center gap-2 px-4 py-2 rounded-lg
              bg-gold-400 text-navy-950 text-sm font-display tracking-wide
              hover:bg-gold-300 transition-colors">
      Live Demo
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    </a>

    <!-- Mobile hamburger -->
    <button id="menu-btn" class="md:hidden text-slate-300 hover:text-white" aria-label="Menu">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </nav>

  <!-- Mobile menu drawer -->
  <div id="mobile-menu" class="fixed inset-0 z-40 bg-navy-950/95 backdrop-blur-md
              flex flex-col items-center justify-center gap-8
              text-xl font-display tracking-wide
              transition-all duration-300 opacity-0 pointer-events-none">
    <button id="menu-close" class="absolute top-5 right-6 text-slate-400 hover:text-white text-3xl">&times;</button>
    <a href="/" class="hover:text-gold-400 transition-colors">Home</a>
    <a href="/dashboard" class="hover:text-gold-400 transition-colors">Dashboard</a>
    <a href="/analytics" class="hover:text-gold-400 transition-colors">Analytics</a>
    <a href="/about" class="hover:text-gold-400 transition-colors">About</a>
    <a href="/dashboard" class="mt-4 px-8 py-3 bg-gold-400 text-navy-950 rounded-lg">Live Demo</a>
  </div>

  <!-- ════════════════════════════════ MAIN CONTENT ════════════════════════════════ -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- ════════════════════════════════ FOOTER ════════════════════════════════ -->
  <footer class="border-t border-navy-700 bg-navy-950 px-6 md:px-12 py-8">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="text-slate-400 text-sm">
        &copy; 2025 Tritiya · Built as an Academy Final Project
      </p>
      <div class="flex gap-6 text-sm text-slate-400">
        <a href="/" class="hover:text-white transition-colors">Home</a>
        <a href="/dashboard" class="hover:text-white transition-colors">Dashboard</a>
        <a href="/analytics" class="hover:text-white transition-colors">Analytics</a>
        <a href="/about" class="hover:text-white transition-colors">About</a>
      </div>
    </div>
  </footer>

  <!-- ════════════════════════════════ SHARED JS ════════════════════════════════ -->
  <script>
    // ── Navbar background on scroll ──
    const navbar = document.getElementById("navbar");
    window.addEventListener("scroll", () => {
      if (window.scrollY > 40) {
        navbar.style.background = "rgba(4,13,26,0.95)";
        navbar.style.backdropFilter = "blur(12px)";
        navbar.style.borderBottom = "1px solid rgba(16,43,86,.5)";
      } else {
        navbar.style.background = "rgba(4,13,26,0)";
        navbar.style.backdropFilter = "none";
        navbar.style.borderBottom = "none";
      }
    });

    // ── Mobile menu toggle ──
    const menuBtn = document.getElementById("menu-btn");
    const menuClose = document.getElementById("menu-close");
    const mobileMenu = document.getElementById("mobile-menu");

    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.remove("opacity-0", "pointer-events-none");
    });
    menuClose.addEventListener("click", () => {
      mobileMenu.classList.add("opacity-0", "pointer-events-none");
    });
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
